- name: Run SMS Bot
        env:
          RC_CLIENT_ID:     ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT:           ${{ secrets.RC_JWT }}
          RC_PHONE:         ${{ secrets.RC_PHONE }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python sms_bot.py
